# FA1 - Multi-Environment Container Deployment Helper (Optional Local Testing)
services:
  backend:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    image: multi-container-app-backend:qa
    container_name: multi-container-app-backend-qa
    ports:
      - "5001:5000"
    environment:
      - ENVIRONMENT=qa
      - APP_VERSION=1.0.0
      - LOG_LEVEL=DEBUG
      - PORT=5000
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    image: multi-container-app-frontend:qa
    container_name: multi-container-app-frontend-qa
    ports:
      - "8081:80"
    networks:
      - app_network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  app_network:
    name: multi-container-app-qa-net
    driver: bridge
