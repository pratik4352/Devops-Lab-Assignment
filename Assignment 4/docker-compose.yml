services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-flask-app:latest
    container_name: flask-web-service
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=development
      - PORT=5000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen("http://localhost:5000/health")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
